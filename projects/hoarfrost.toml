id = "hoarfrost"
name = "Hoarfrost"
status = "active"

repo = "/home/wodox/skyrim-dev/repos/Hoarfrost"

[capabilities]
windows_native_build = true
runtime_deployment = true

[[environments]]
id = "assos"
role = "primary-test"

[[environments]]
id = "mo2vr"
role = "vr-validation"

[build.windows_native]
command = "./tools/windows-build.sh"
evidence_root = "/home/wodox/skyrim-dev/artifacts/windows-build"
expected_source_sha256 = "df5dc81a13e889b75bf145b9426358142fd23e5ff1e9009c8e7210e11650eb83"

[[deployment.targets]]
id = "development"
environment = "assos"
mod = "Hoarfrost - Development"
sets = ["ordinary-finger-native", "ordinary-finger-manual-tests"]

[[deployment.sets]]
id = "ordinary-finger-native"
provenance = "windows-native-build"

[[deployment.sets.files]]
id = "hoarfrost-native-dll"
source = "Hoarfrost.dll"
destination = "SKSE/Plugins/Hoarfrost.dll"
expected_sha256 = "e9bdb4c9e34c95ec30e13e9fcf25037ef647cdd5c2f6cdd6de9a8c5d2cfb60b0"

[[deployment.sets.files]]
id = "hoarfrost-native-pdb"
source = "Hoarfrost.pdb"
destination = "SKSE/Plugins/Hoarfrost.pdb"
expected_sha256 = "3bacef002c5310f1a064c6e4b349f68585755d28dfa3fd69d63ad8c41b08f640"

