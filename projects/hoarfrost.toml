id = "hoarfrost"
name = "Hoarfrost"
status = "active"

repo = "/home/wodox/skyrim-dev/repos/Hoarfrost"

[capabilities]
windows_native_build = true
runtime_deployment = true

[[environments]]
id = "assos"
role = "primary-test"

[[environments]]
id = "mo2vr"
role = "vr-validation"

[build.windows_native]
default_variant = "ordinary"
command = "./tools/windows-build.sh"
evidence_root = "/home/wodox/skyrim-dev/artifacts/windows-build"
expected_source_sha256 = "15253e81df3a112c99eedb25efddcaa9219a14ca7fb845ad6c422de952a59d5a"

[[build.windows_native.variants]]
id = "schema-v4-runtime-proof"
command = "./tools/windows-build.sh"
arguments = ["schema-v4-runtime-proof"]
evidence_root = "/home/wodox/skyrim-dev/artifacts/windows-build/schema-v4-runtime-proof"
expected_source_sha256 = "17d212b0c4e47f2949d89fefacd3319e5fd4d5a440363a722a0cf28f6132b2ef"
required_log_marker = "Hoarfrost runtime-test-seams: on"

[[deployment.targets]]
id = "schema-v4-runtime-proof"
environment = "assos"
mod = "Hoarfrost - Schema V4 Runtime Proof"
sets = [
  "schema-v4-runtime-proof-native",
  "schema-v4-runtime-proof-inputs-inject",
  "schema-v4-runtime-proof-inputs-observe",
]

[[deployment.targets]]
id = "development"
environment = "assos"
mod = "Hoarfrost - Development"
sets = ["ordinary-finger-native", "ordinary-finger-manual-tests"]

[[deployment.sets]]
id = "schema-v4-runtime-proof-native"
provenance = "windows-native-build"
build_variant = "schema-v4-runtime-proof"

[[deployment.sets.files]]
id = "schema-v4-runtime-proof-dll"
source = "Hoarfrost.dll"
destination = "SKSE/Plugins/Hoarfrost.dll"
