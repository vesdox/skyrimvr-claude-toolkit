id = "housecarl"
name = "houseCARL"

status = "available"
execution = "windows"
risk = "read"

requires_mo2_vfs = false
requires_running_game = false
requires_environment_write = false

description = """
Primary load-order-aware Skyrim data inspection through houseCARL and Mutagen.
Reads the configured MO2 instance statically; MO2 does not need to be running.
"""

notes = """
houseCARL is the preferred capability for routine record, conflict, load-order,
asset, and plugin inspection when its read-only bridge can satisfy the request.

Do not expose the raw houseCARL MCP server to agents: the upstream server also
contains authoring and mutation operations. Activation requires a constrained
Windows read-only bridge that exposes only approved inspection actions.

This capability does not use MO2 USVFS and must not be routed through the
hardened Windows native-build identity.
"""

[actions.read-record]
handler = "housecarl-read"
description = "Read one Skyrim record through the constrained Windows houseCARL bridge."


[actions.diff-record]
handler = "housecarl-read"
description = "Compare two explicit plugin versions of one Skyrim record through the constrained Windows houseCARL bridge."


[actions.query-records]
handler = "housecarl-read"
description = "Search a bounded set of Skyrim records by type, plugin scope, EditorID substring, and conflict status through the constrained Windows houseCARL bridge."
