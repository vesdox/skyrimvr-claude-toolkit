id = "xelib"
name = "xelib"

status = "unconfigured"
execution = "windows-mo2"
risk = "read"

requires_mo2_vfs = true
requires_running_game = false
requires_environment_write = false

description = """
Read-only xEdit-native inspection and verification using XEditLib against an
MO2 virtualized Skyrim Data directory.
"""

notes = """
xelib is an explicit verification capability, not the default Skyrim data layer.
Use houseCARL for routine load-order and record inspection when possible.

XEditLib is Windows-only and expects a conventional merged Data directory.
Under MO2, full load-order inspection therefore executes through MO2 USVFS.

The underlying XEditLib API contains mutation and SaveFile operations, but this
capability must expose read-only actions only. Future xelib authoring belongs in
a separate capability and trust boundary.
"""
