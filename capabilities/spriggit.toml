id = "spriggit"
name = "Spriggit Inspection"

status = "available"
execution = "linux"
risk = "read"

requires_mo2_vfs = false
requires_running_game = false
requires_environment_write = false

description = """
Inspect Skyrim plugins by serializing them to structured YAML in the toolkit
artifact area. This capability does not deserialize YAML back into plugins.
"""

notes = """
Localized plugins may fail on Linux when localized string/BSA resolution is
required. Such plugins will eventually require a registered Windows serialization
route rather than an improvised fallback.
"""

[implementation]
driver = "tools/skyrim-inspect-plugin.py"
tool_manifest = ".config/dotnet-tools.json"
package = "spriggit.cli"
package_version = "0.40.0"
game_release = "SkyrimSE"
format_package = "Spriggit.Yaml"
